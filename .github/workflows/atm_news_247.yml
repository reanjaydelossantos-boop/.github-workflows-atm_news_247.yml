name: ATM News PH 24/7 Automated Poster

on:
  schedule:
    # Runs every 30 minutes 24/7 in the GitHub Cloud (even when laptop is off)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual run button in GitHub

jobs:
  post-latest-ph-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ATM News PH Poster
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: |
          python runner.py --post-now

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "ATM News PH Bot"
          git config --global user.email "bot@atmnewsph.internal"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted history [skip ci]" && git push)
